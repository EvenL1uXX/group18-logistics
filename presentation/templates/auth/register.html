{% extends "base.html" %}
{% block title %}Register · Group 18{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Create a customer account</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="full_name">Full name</label>
            <input class="form-control" id="full_name" name="full_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="phone">Phone (optional)</label>
            <input class="form-control" id="phone" name="phone">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" minlength="6" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">Register</button>
        </form>
        <hr>
        <p class="mb-0 small text-muted">
          Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
